<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded non-blocking: on offline/air-gapped hosts a blocking font sheet
         would stall first paint, and the local font stack already covers us. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>MailMatrix</title>
    <script>
      // Apply the saved theme before first paint so a reload does not flash the
      // dark palette before React mounts. Keeping this inline (not a module)
      // guarantees it runs before the stylesheet-dependent render.
      (function () {
        try {
          var saved = localStorage.getItem("mailmatrix.theme");
          if (saved === "light" || saved === "glass" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {
          /* private mode or blocked storage: fall back to the dark default */
        }
      })();
    </script>
