# Fly.io deployment. Replace the app name with your own before first deploy.
app = "email-orchestrator"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  ENABLE_BACKGROUND_JOBS = "true"
  # Keep autonomous sending off until the deployment has been verified.
  MAIL_SUPPRESS_SEND = "true"
  AUTOPILOT = "false"
  AUTO_APPROVE = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # /health verifies the database connection as well as the process.
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
