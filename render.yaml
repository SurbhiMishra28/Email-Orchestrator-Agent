services:
  - type: web
    # This name must match the service in the Render dashboard. Reusing an
    # existing service's name makes a Blueprint sync apply this configuration to
    # it instead of creating a second, duplicate service. It matters here: a
    # service created by hand keeps its own build command, and without the npm
    # step below the API runs but `frontend/dist` is never built, so `/` returns
    # {"message":"Frontend not built..."}.
    name: email-orchestrator-agent
    # Native Python runtime. Node and npm are present in Render's build
    # environment, so the same job compiles the dashboard that app/main.py
    # mounts from frontend/dist.
    runtime: python
    plan: starter
    # APScheduler drives inbox polling and autopilot, and the send worker holds
    # a thread between requests for the 60-second pacing rule. That only works
    # in a single long-lived instance, never with autoscaling.
    numInstances: 1
    buildCommand: pip install -r requirements.txt && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # /health returns 503 when the database is unreachable, so a broken
    # DATABASE_URL fails the deploy instead of serving 500s.
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Render offers managed Postgres, not MySQL, and this schema is written for
    # MySQL/MariaDB. A disk keeps the SQLite database across restarts and
    # redeploys so the service works with no external database at all. To use a
    # real MySQL server instead, delete `disk` and set DATABASE_URL to its
    # connection string (see docs/DEPLOYMENT.md).
    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: DATABASE_URL
        # Four slashes: absolute path inside the mounted disk.
        value: sqlite:////var/data/email_orchestrator.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SINGLE_USER_MODE
        value: "false"
      # PUBLIC_BASE_URL and CORS_ORIGINS are intentionally unset: the app reads
      # RENDER_EXTERNAL_URL itself, so tracking links and browser calls point at
      # the deployed host without a hand-copied value.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASS
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # Keep autonomous sending off until a human has verified the deployment.
      - key: MAIL_SUPPRESS_SEND
        value: "true"
      - key: AUTOPILOT
        value: "false"
      - key: AUTO_APPROVE
        value: "false"
      - key: ENABLE_BACKGROUND_JOBS
        value: "true"
